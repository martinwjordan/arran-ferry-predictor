    state: |-
      {% set m = (state_attr('sensor.house_ferry_chances', 'next') or []) | selectattr('route', 'eq', '301') | selectattr('from', 'eq', 'Troon') | list %}
      {% set x = m[0].sailings[0] if m and m[0].sailings else none %}
      {{ none if not x else 0 if x.calmac == 'cancelled' else x.chance }}
    attributes:
      time: |-
        {% set m = (state_attr('sensor.house_ferry_chances', 'next') or []) | selectattr('route', 'eq', '301') | selectattr('from', 'eq', 'Troon') | list %}
        {% set x = m[0].sailings[0] if m and m[0].sailings else none %}
        {{ (as_timestamp(as_local(as_datetime(x.date ~ ' ' ~ x.time))) | timestamp_custom('%a %H:%M')) if x else '' }}
      label: |-
        {% set m = (state_attr('sensor.house_ferry_chances', 'next') or []) | selectattr('route', 'eq', '301') | selectattr('from', 'eq', 'Troon') | list %}
        {% set x = m[0].sailings[0] if m and m[0].sailings else none %}
        {% set words = {'cancelled': 'cancelled by CalMac', 'diverted': 'diverted', 'at_risk_diversion': 'may divert', 'at_risk': 'at risk'} %}
        {{ ((x.calmac and words.get(x.calmac, x.calmac)) or (x.band if x.show == 'band' else x.chance ~ '%')) if x else '' }}
- binary_sensor:
  - name: House alert ferry chance
    unique_id: house_alert_ferry_chance
    icon: mdi:ferry
    state: >-
      {{ states('sensor.house_ferry_chance_lowest') | is_number and states('sensor.house_ferry_chance_lowest') | int < 75
         and (state_attr('sensor.house_ferry_chances', 'sanity') or {}).get('status') != 'fail' }}
    attributes:
      severity: '{{ ''warning'' if states(''sensor.house_ferry_chance_lowest'') | int(100) < 40 else ''info'' }}'
      message: 'Ferry chances: {{ state_attr(''sensor.house_ferry_chance_lowest'', ''sailing'') }} (lowest in the next 24 hours)'
  - name: House alert ferry data
    unique_id: house_alert_ferry_data
    icon: mdi:database-alert
    state: "{{ (state_attr('sensor.house_ferry_chances', 'sanity') or {}).get('status') == 'fail' }}"
    attributes:
      severity: warning
      message: >-
        {% set m = (state_attr('sensor.house_ferry_chances', 'sanity') or {}).get('messages') or [] %}
        Ferry predictor data problem: {{ m[0] if m else 'failed its checks' }} Check CalMac directly.
