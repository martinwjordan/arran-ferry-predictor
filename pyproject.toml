[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ferrypredictor"
version = "0.1.0"
description = "Likelihood of Arran ferry sailings running, up to five days ahead (unofficial)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Martin Jordan" }]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pyarrow>=16",
    "pyyaml>=6",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
