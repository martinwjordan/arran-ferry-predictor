name: collect

on:
  schedule:
    - cron: "0,20,40 * * * *"
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FERRY_CONFIG_DIR: ${{ github.workspace }}/config
      FERRY_DATA_DIR: ${{ github.workspace }}/store/data
      FERRY_SITE_DIR: ${{ github.workspace }}/store/site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Check out the data branch
        run: bash scripts/checkout_data_branch.sh store
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect CalMac status, notices and sailings
        run: python -m ferrypredictor collect
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      - name: Commit data
        if: always()
        run: 'bash scripts/commit_with_retry.sh "collect: $(date -u +%Y-%m-%dT%H:%MZ)" store'
      - name: Raise an issue after three failures in a row
        if: failure()
        run: bash scripts/issue_on_repeated_failure.sh collect.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
